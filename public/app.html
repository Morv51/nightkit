<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NightKit — Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<script src="/mp4-muxer.js"></script>

<!-- Supabase auth: client + session guard -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  (function(){
    var SUPABASE_URL  = 'https://jnkujsfsmmieodthpelm.supabase.co';
    var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impua3Vqc2ZzbW1pZW9kdGhwZWxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NDc1NzMsImV4cCI6MjA5NjMyMzU3M30.0Uc6KNZDFaQd94P0kqFyhvPFvwbgH-BHwLmHqzEUITQ';
    window.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    // Guard: only authenticated users may use the generator. Runs before the
    // app module so unauthenticated visitors are bounced to /login.html.
    // If a confirmation link lands here with ?token_hash=… (OTP), redeem it
    // first — supabase-js auto-detects #access_token / ?code but not token_hash.
    window.__nkSession = (async function(){
      try {
        var q = new URLSearchParams(location.search);
        if (q.get('token_hash')) {
          await window.sb.auth.verifyOtp({ token_hash: q.get('token_hash'), type: q.get('type') || 'email' });
          if (q.get('type') === 'recovery'){ location.replace('/reset.html'); return null; }
        }
        var r = await window.sb.auth.getSession();
        var session = r && r.data && r.data.session;
        if (!session){ location.replace('/login.html'); return null; }
        return session;
      } catch (e) { return null; }
    })();
  })();
</script>
<style>
  .user-chip{position:relative;margin-left:14px}
  .user-av{width:36px;height:36px;border-radius:50%;background:#CCFF00;color:#0a0a0a;font-weight:700;font-size:15px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
  .user-menu{position:absolute;top:46px;right:0;min-width:210px;background:#111;border:1px solid #222;border-radius:12px;padding:8px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .15s,transform .15s,visibility .15s;z-index:60;box-shadow:0 16px 40px rgba(0,0,0,.5)}
  .user-chip:hover .user-menu,.user-menu.open{opacity:1;visibility:visible;transform:none}
  .user-email{font-size:12px;color:#888;padding:8px 10px 10px;word-break:break-all;border-bottom:1px solid #222;margin-bottom:6px}
  .user-logout{width:100%;text-align:left;background:none;border:none;color:#fff;font-family:inherit;font-size:14px;font-weight:600;padding:9px 10px;border-radius:8px;cursor:pointer;transition:background .12s,color .12s}
  .user-logout:hover{background:rgba(255,90,90,.13);color:#ff5a5a}
  /* vibe textarea */
  .vibe-input{width:100%;padding:8px 10px;background:rgba(255,255,255,.05);border:0.5px solid rgba(255,255,255,.1);border-radius:6px;color:var(--text);font-size:13px;font-family:inherit;line-height:1.45;resize:none;outline:none;transition:border-color .15s}
  .vibe-input:focus{border-color:rgba(232,255,71,.4)}
  .vibe-input::placeholder{color:rgba(245,245,240,.2)}
  /* instagram caption */
  .caption-section{margin-top:8px;padding-top:14px;border-top:0.5px solid rgba(255,255,255,.08)}
  .caption-head{font-size:10px;color:rgba(245,245,240,.35);letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:9px}
  .caption-styles{display:flex;gap:6px;margin-bottom:10px}
  .cap-style{flex:1;background:rgba(255,255,255,.05);border:0.5px solid rgba(255,255,255,.1);border-radius:6px;color:var(--text);font-family:inherit;font-size:12.5px;font-weight:500;padding:8px 4px;cursor:pointer;transition:border-color .15s,background .15s}
  .cap-style:hover{border-color:rgba(255,255,255,.2)}
  .cap-style.active{border-color:var(--accent);background:rgba(232,255,71,.1)}
  .cap-gen{width:100%;justify-content:center}
  .caption-box{margin-top:12px;background:rgba(255,255,255,.04);border:0.5px solid rgba(255,255,255,.1);border-radius:8px;padding:14px}
  .caption-box-head{display:flex;justify-content:flex-end;margin-bottom:6px}
  .cap-copy{background:rgba(255,255,255,.06);border:0.5px solid rgba(255,255,255,.12);border-radius:6px;color:var(--text);font-family:inherit;font-size:11.5px;font-weight:600;padding:5px 10px;cursor:pointer;transition:border-color .15s,color .15s}
  .cap-copy:hover{border-color:var(--accent);color:var(--accent)}
  .cap-copy.copied{border-color:#7CE38B;color:#7CE38B}
  .caption-text{font-size:12.5px;line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word}
  .cap-regen{display:inline-block;margin-top:11px;font-size:11.5px;color:var(--muted);text-decoration:none}
  .cap-regen:hover{color:var(--accent)}
</style>
</head>
<body>

<!-- OVERLAY -->
<div class="overlay" id="ov">
  <div class="ring"><div class="ring-n">N</div></div>
  <div class="ov-title">Flyer wird generiert…</div>
  <div class="ov-dots"><div class="ov-dot"></div><div class="ov-dot"></div><div class="ov-dot"></div></div>
  <div class="ov-timer" id="ovTimer"></div>
</div>

<!-- TOPBAR -->
<header class="topbar">
  <a class="logo" href="/">
    <div class="logo-icon">
      <svg viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12M4 2.5L10 11.5M10 2.5L4 11.5" stroke="#0c0c0c" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
    <span class="logo-name">NightKit</span>
  </a>
  <a class="topbar-back" href="/">← Zurück zur Übersicht</a>
  <div class="user-chip" id="userChip" hidden>
    <button class="user-av" id="userAv" type="button" aria-label="Account">U</button>
    <div class="user-menu" id="userMenu">
      <div class="user-email" id="userEmail">…</div>
      <button class="user-logout" id="userLogout" type="button">Abmelden</button>
    </div>
  </div>
</header>

<div class="app">

  <!-- ── COL 1: SIDEBAR FORM ── -->
  <aside class="sidebar">
    <div class="sidebar-scroll">

      <div class="sec-label">Event</div>
      <div class="field"><label>Subline</label><input id="fPrefix" placeholder="z. B. 5 Jahre"></div>
      <div class="field"><label>Headline</label><input id="fName" value="Black Friday"></div>
      <div class="row">
        <div class="field"><label>Datum</label><input type="date" id="fDatePicker" value="2026-06-30"></div>
        <div class="field"><label>Wochentag</label><input id="fDay" readonly placeholder="automatisch"></div>
      </div>
      <input type="hidden" id="fDate">
      <div class="field">
        <label>DJs / Acts</label>
        <input id="fDj" value="Crazy Cutz, Marveles" placeholder="kommagetrennt">
        <div class="field-hint">Mehrere mit Komma trennen — erscheinen als Lineup-Zeile unter dem Banner.</div>
      </div>

      <div class="sec-divider"></div>
      <div class="sec-label">Details</div>
      <div class="field"><label>Uhrzeit</label><input id="fTime" value="23:00"></div>
      <div class="field"><label>Website</label><input id="fContact" value="www.crazy-cutz.de"></div>
      <div class="field">
        <label>Vibe / Beschreibung</label>
        <textarea id="fVibe" class="vibe-input" rows="4" placeholder="z. B. Open Air Sommerfest, entspannte Atmosphäre, Eintritt frei bis 23 Uhr, Fokus auf House und Deep House…"></textarea>
      </div>
      <div class="field">
        <label>Logo</label>
        <input type="file" id="fLogo" class="file-input" accept="image/*">
        <img id="logoPreview" class="logo-preview" alt="Logo-Vorschau">
      </div>

    </div>
  </aside>

  <!-- ── COL 2: TEMPLATE PICKER ── -->
  <main class="center">
    <div class="center-head">
      <div class="center-title">Template</div>
    </div>
    <div class="center-body">
      <div class="tpl-grid" id="tplGrid"></div>
    </div>
  </main>

  <!-- ── COL 3: PREVIEW + BUTTON ── -->
  <div class="panel">
    <div class="panel-body" id="panelBody">

      <!-- STATE: Preview (default) -->
      <div id="statePreview">
        <div class="preview-wrap">
          <div class="preview-stage" id="previewStage">
            <img id="previewImg" class="preview-img" alt="Vorschau">
            <div class="logo-overlay" id="logoOverlay">
              <span class="logo-overlay-text">LOGO ziehen</span>
              <img id="logoOverlayImg" class="logo-overlay-img" alt="Logo">
              <div class="logo-resize" id="logoResize"></div>
            </div>
          </div>
        </div>
        <div class="preview-hint" id="previewHint">Logo ziehen &amp; Ecke zum Skalieren</div>
      </div>

      <!-- STATE: Result (after generation) -->
      <div id="stateResult" style="display:none">
        <div style="display:flex;flex-direction:column;gap:10px">
          <div class="result-img-wrap">
            <img id="resultImg" alt="Ergebnis">
          </div>
          <div class="result-btns">
            <button class="rbtn rbtn-primary" id="btnDlPng">↓ PNG</button>
            <button class="rbtn rbtn-primary" id="btnDlJpg">↓ JPG</button>
            <button class="rbtn rbtn-ghost" id="copyBtn">⎘ Kopieren</button>
          </div>
          <button class="rbtn rbtn-regen" id="btnReset">↺ Neues Template wählen</button>

          <!-- History -->
          <div class="hist-wrap" id="histWrap" style="display:none">
            <div class="hist-lbl">Zuletzt</div>
            <div class="hist-row" id="histRow"></div>
          </div>

          <!-- Video Export -->
          <div class="video-section">
            <div class="video-head">
              <span>Video Export</span>
              <span class="video-chevron" id="videoChevron">▾</span>
            </div>
            <div class="video-body" id="videoBody">
              <div class="style-row"></div>
              <div class="video-controls">
                <button class="rbtn rbtn-ghost" id="btnPv">▶ Preview</button>
                <button class="rbtn rbtn-primary" id="exportBtn">↓ Video</button>
                <span class="video-status" id="videoStatus"></span>
              </div>
              <div class="pv-canvas-wrap" id="previewWrap">
                <canvas id="videoCanvas"></canvas>
              </div>
            </div>
          </div>

          <!-- Instagram Caption -->
          <div class="caption-section">
            <div class="caption-head">Instagram Caption</div>
            <div class="caption-styles" id="captionStyles">
              <button class="cap-style active" data-style="hype" type="button">🔥 Hype</button>
              <button class="cap-style" data-style="elegant" type="button">✨ Elegant</button>
              <button class="cap-style" data-style="casual" type="button">😎 Casual</button>
            </div>
            <button class="rbtn rbtn-primary cap-gen" id="btnCaption">Caption generieren</button>
            <div class="caption-box" id="captionBox" style="display:none">
              <div class="caption-box-head">
                <button class="cap-copy" id="captionCopy" type="button">⎘ Kopieren</button>
              </div>
              <div class="caption-text" id="captionText"></div>
              <a class="cap-regen" id="captionRegen" href="#">↺ Neu generieren</a>
            </div>
          </div>
        </div>
      </div>

    </div><!-- /panel-body -->

    <div class="panel-foot">
      <button class="gen-btn" id="genBtn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1L8.5 5.5L13 7L8.5 8.5L7 13L5.5 8.5L1 7L5.5 5.5L7 1Z" fill="#0c0c0c"/></svg>
        <span id="genTxt">Flyer generieren</span>
      </button>
      <div class="err" id="errBox"></div>
    </div>
  </div><!-- /panel -->

</div><!-- /app -->

<script type="module" src="/js/main.js"></script>
<script>
  // Render the user chip (avatar + email + logout) once the session resolves.
  (async function(){
    var session = await (window.__nkSession || Promise.resolve(null));
    if (!session || !window.sb) return; // not authenticated (already redirecting)
    var email = (session.user && session.user.email) || '';
    var chip   = document.getElementById('userChip');
    var av     = document.getElementById('userAv');
    var menu   = document.getElementById('userMenu');
    document.getElementById('userEmail').textContent = email;
    av.textContent = (email.charAt(0) || 'U').toUpperCase();
    chip.hidden = false;

    // Click toggles the menu too (hover handled by CSS for desktop).
    av.addEventListener('click', function(e){ e.stopPropagation(); menu.classList.toggle('open'); });
    document.addEventListener('click', function(e){ if (!chip.contains(e.target)) menu.classList.remove('open'); });

    document.getElementById('userLogout').addEventListener('click', async function(){
      try { await window.sb.auth.signOut(); } catch (e) {}
      location.replace('/login.html');
    });
  })();
</script>

</body>
</html>
