<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NightKit Bestandsverwaltung</title>
<style>
  :root{
    --bg:#0d0d10; --panel:#17171c; --panel2:#1f1f27; --line:#2a2a33;
    --text:#ececf1; --muted:#9a9aa8; --accent:#7c5cff; --accent2:#5a3ff0;
    --danger:#ff5470; --ok:#33c98a; --chip:#26262f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;color:#fff;background:var(--accent);transition:.15s}
  button:hover{background:var(--accent2)}
  button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  button.ghost:hover{background:var(--chip)}
  button.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  button.danger:hover{background:rgba(255,84,112,.12)}
  button:disabled{opacity:.4;cursor:not-allowed}
  input,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
  a{color:var(--accent)}

  /* Gate */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50}
  #gate .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:min(360px,92vw);text-align:center}
  #gate h1{font-size:19px;margin:0 0 6px}
  #gate p{color:var(--muted);margin:0 0 18px;font-size:13px}
  #gate input{text-align:center;letter-spacing:.2em;margin-bottom:12px}
  #gate button{width:100%}
  #gateErr{color:var(--danger);font-size:13px;min-height:18px;margin-top:10px}

  /* App */
  #app{display:none;max-width:1200px;margin:0 auto;padding:18px 16px 80px}
  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  header.top h1{font-size:18px;margin:0;margin-right:auto}
  .tabs{display:flex;gap:8px}
  .tab{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .tab.active{background:var(--accent);color:#fff;border-color:transparent}
  .count{font-size:12px;color:var(--muted);margin-left:6px}

  .catblock{margin:22px 0}
  .cathead{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:12px}
  .cathead h2{font-size:15px;margin:0;text-transform:uppercase;letter-spacing:.05em}
  .cathead .n{color:var(--muted);font-size:12px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .tile .thumbwrap{aspect-ratio:9/16;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .tile img{width:100%;height:100%;object-fit:cover;display:block}
  .tile .meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
  .tile .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .cat{font-size:11px;color:var(--muted)}
  .tile .cat .ov{color:var(--accent)}
  .tile .actions{display:flex;flex-direction:column;gap:6px;padding:8px 10px 10px;margin-top:auto}
  .tile .actions button{width:100%;padding:7px 8px;font-size:12.5px;border-radius:8px}

  .empty{color:var(--muted);text-align:center;padding:60px 0}
  .hint{color:var(--muted);font-size:12.5px;margin:6px 0 0}
  .purgebox{margin-top:26px;border:1px dashed var(--line);border-radius:12px;padding:14px 16px;color:var(--muted);font-size:13px}

  /* Modal */
  #modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:60;padding:16px}
  #modal .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(420px,94vw)}
  #modal h3{margin:0 0 4px;font-size:16px}
  #modal .sub{color:var(--muted);font-size:13px;margin:0 0 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
  #modal .or{text-align:center;color:var(--muted);font-size:12px;margin:12px 0 0}
  #modal .row{display:flex;gap:8px;margin-top:20px}
  #modal .row button{flex:1}

  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:90vw}
  #toast.show{opacity:1}
  #toast.err{border-color:var(--danger);color:#ffd7de}
  #toast.good{border-color:var(--ok);color:#c9f5e2}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h1>NightKit Verwaltung</h1>
    <p>Interner Admin-Bereich. Bitte Code eingeben.</p>
    <input id="code" type="password" inputmode="numeric" placeholder="Code" autocomplete="off">
    <button id="gateBtn">Weiter</button>
    <div id="gateErr"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1>Bestandsverwaltung</h1>
    <div class="tabs">
      <button class="tab active" data-tab="manage">Verwaltung <span class="count" id="cManage"></span></button>
      <button class="tab" data-tab="trash">Papierkorb <span class="count" id="cTrash"></span></button>
    </div>
    <button class="ghost" id="reload">Aktualisieren</button>
  </header>

  <div id="viewManage"></div>
  <div id="viewTrash" style="display:none"></div>
</div>

<div id="modal">
  <div class="card">
    <h3>In andere Kategorie verschieben</h3>
    <p class="sub" id="mSub"></p>
    <label>Bestehende Kategorie</label>
    <select id="mSelect"></select>
    <p class="or">oder</p>
    <label>Neue Kategorie anlegen</label>
    <input id="mNew" type="text" placeholder="z. B. Sommer Open Air" maxlength="60">
    <div class="row">
      <button class="ghost" id="mCancel">Abbrechen</button>
      <button id="mSave">Verschieben</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";
  var token = null;
  var data = { templates: [], categories: [] };
  var tab = "manage";
  var moveFile = null;

  var $ = function(s){ return document.querySelector(s); };
  function toast(msg, kind){
    var t = $("#toast"); t.textContent = msg;
    t.className = "show" + (kind ? " " + kind : "");
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.className = ""; }, 2600);
  }

  async function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({ "Content-Type":"application/json", "X-Admin-Token": token || "" }, opts.headers || {});
    var r = await fetch(path, opts);
    if (r.status === 401){ showGate("Sitzung abgelaufen, bitte erneut anmelden."); throw new Error("401"); }
    var j = null; try { j = await r.json(); } catch(e){}
    if (!r.ok) throw new Error((j && j.error) || ("Fehler " + r.status));
    return j;
  }

  // ── Gate ──
  function showGate(msg){
    token = null; $("#app").style.display = "none"; $("#gate").style.display = "flex";
    $("#gateErr").textContent = msg || ""; $("#code").value = ""; $("#code").focus();
  }
  async function doAuth(){
    var code = $("#code").value.trim();
    if (!code) return;
    $("#gateBtn").disabled = true; $("#gateErr").textContent = "";
    try {
      var r = await fetch("/admin/auth", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ code: code }) });
      var j = await r.json();
      if (!r.ok || !j.token) throw new Error(j.error || "Falscher Code");
      token = j.token;
      $("#gate").style.display = "none"; $("#app").style.display = "block";
      await load();
    } catch(e){ $("#gateErr").textContent = e.message || "Anmeldung fehlgeschlagen"; }
    finally { $("#gateBtn").disabled = false; }
  }

  // ── Laden + Rendern ──
  async function load(){
    try {
      data = await api("/admin/manage/list");
      $("#cManage").textContent = data.counts ? "(" + (data.counts.total - data.counts.hidden) + ")" : "";
      $("#cTrash").textContent = data.counts ? "(" + data.counts.hidden + ")" : "";
      render();
    } catch(e){ if (e.message !== "401") toast(e.message, "err"); }
  }

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

  function tileHTML(t, kind){
    var catLine = kind === "trash"
      ? '<div class="cat">Kategorie: ' + esc(t.folderCategory) + '</div>'
      : '<div class="cat">' + (t.overridden ? '<span class="ov">verschoben nach</span> ' + esc(t.category) : esc(t.category)) + '</div>';
    var actions = kind === "trash"
      ? '<button class="ghost" data-act="restore" data-file="'+esc(t.file)+'">Wiederherstellen</button>'
      : '<button class="ghost" data-act="move" data-file="'+esc(t.file)+'">Verschieben</button>' +
        '<button class="danger" data-act="hide" data-file="'+esc(t.file)+'">Löschen</button>';
    return '<div class="tile">' +
      '<div class="thumbwrap"><img loading="lazy" src="'+esc(t.thumb)+'" alt=""></div>' +
      '<div class="meta"><div class="name" title="'+esc(t.name)+'">'+esc(t.name)+'</div>'+catLine+'</div>' +
      '<div class="actions">'+actions+'</div></div>';
  }

  function render(){
    // Verwaltung: sichtbare, gruppiert nach effektiver Kategorie
    var visible = data.templates.filter(function(t){ return !t.hidden; });
    var mv = $("#viewManage");
    if (!visible.length){ mv.innerHTML = '<div class="empty">Keine sichtbaren Templates.</div>'; }
    else {
      var byCat = {};
      visible.forEach(function(t){ (byCat[t.category] = byCat[t.category] || []).push(t); });
      var cats = Object.keys(byCat).sort(function(a,b){ return a.localeCompare(b,"de"); });
      mv.innerHTML = cats.map(function(c){
        return '<div class="catblock"><div class="cathead"><h2>'+esc(c)+'</h2><span class="n">'+byCat[c].length+'</span></div>' +
          '<div class="grid">' + byCat[c].map(function(t){ return tileHTML(t,"manage"); }).join("") + '</div></div>';
      }).join("");
    }

    // Papierkorb: ausgeblendete
    var hidden = data.templates.filter(function(t){ return t.hidden; });
    var tv = $("#viewTrash");
    var trashGrid = hidden.length
      ? '<div class="grid">' + hidden.map(function(t){ return tileHTML(t,"trash"); }).join("") + '</div>'
      : '<div class="empty">Der Papierkorb ist leer.</div>';
    tv.innerHTML =
      '<p class="hint">Gelöschte Templates sind hier geparkt und aus Galerie und edit-Flow ausgeblendet. Die Bilddateien bleiben unangetastet und lassen sich jederzeit wiederherstellen.</p>' +
      trashGrid +
      '<div class="purgebox"><b>Endgültig löschen</b> kommt bewusst als getrennter, späterer Schritt. In diesem Tool wird nichts unwiderruflich entfernt.' +
      ' <button class="danger" disabled title="Noch nicht aktiv" style="margin-left:8px">Endgültig löschen (später)</button></div>';
  }

  function switchTab(name){
    tab = name;
    document.querySelectorAll(".tab").forEach(function(b){ b.classList.toggle("active", b.dataset.tab === name); });
    $("#viewManage").style.display = name === "manage" ? "block" : "none";
    $("#viewTrash").style.display = name === "trash" ? "block" : "none";
  }

  // ── Aktionen ──
  async function hideTemplate(file){
    var t = data.templates.find(function(x){ return x.file === file; });
    if (!confirm('Template "' + (t ? t.name : file) + '" in den Papierkorb verschieben?\n(Die Datei bleibt erhalten, jederzeit wiederherstellbar.)')) return;
    try { await api("/admin/manage/hide", { method:"POST", body: JSON.stringify({ file: file }) }); toast("In den Papierkorb verschoben", "good"); await load(); }
    catch(e){ if (e.message !== "401") toast(e.message, "err"); }
  }
  async function restoreTemplate(file){
    try { await api("/admin/manage/restore", { method:"POST", body: JSON.stringify({ file: file }) }); toast("Wiederhergestellt", "good"); await load(); }
    catch(e){ if (e.message !== "401") toast(e.message, "err"); }
  }
  function openMove(file){
    var t = data.templates.find(function(x){ return x.file === file; });
    if (!t) return;
    moveFile = file;
    $("#mSub").textContent = t.name + "  (aktuell: " + t.category + ")";
    var sel = $("#mSelect");
    var cats = (data.categories || []).slice();
    sel.innerHTML = cats.map(function(c){ return '<option value="'+esc(c)+'"'+(c===t.category?" selected":"")+'>'+esc(c)+'</option>'; }).join("");
    $("#mNew").value = "";
    $("#modal").style.display = "flex";
    setTimeout(function(){ $("#mNew").focus(); }, 30);
  }
  function closeMove(){ $("#modal").style.display = "none"; moveFile = null; }
  async function confirmMove(){
    if (!moveFile) return;
    var neu = $("#mNew").value.trim();
    var category = neu || $("#mSelect").value;
    if (!category){ toast("Bitte eine Kategorie wählen oder eingeben", "err"); return; }
    try {
      await api("/admin/manage/move", { method:"POST", body: JSON.stringify({ file: moveFile, category: category }) });
      closeMove(); toast("Verschoben nach " + category, "good"); await load();
    } catch(e){ if (e.message !== "401") toast(e.message, "err"); }
  }

  // ── Events ──
  $("#gateBtn").addEventListener("click", doAuth);
  $("#code").addEventListener("keydown", function(e){ if (e.key === "Enter") doAuth(); });
  $("#reload").addEventListener("click", load);
  document.querySelectorAll(".tab").forEach(function(b){ b.addEventListener("click", function(){ switchTab(b.dataset.tab); }); });
  $("#mCancel").addEventListener("click", closeMove);
  $("#mSave").addEventListener("click", confirmMove);
  $("#modal").addEventListener("click", function(e){ if (e.target === $("#modal")) closeMove(); });
  $("#mNew").addEventListener("keydown", function(e){ if (e.key === "Enter") confirmMove(); });
  document.addEventListener("click", function(e){
    var b = e.target.closest("button[data-act]"); if (!b) return;
    var file = b.dataset.file, act = b.dataset.act;
    if (act === "hide") hideTemplate(file);
    else if (act === "restore") restoreTemplate(file);
    else if (act === "move") openMove(file);
  });

  showGate();
})();
</script>
</body>
</html>
